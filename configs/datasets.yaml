# Dataset registry for the rational-gap pipeline.
#
# Each entry is a short alias mapping to:
#
#   hf_id:                    HuggingFace dataset id.
#   hf_config:                Optional dataset config name (e.g. "main"
#                             for GSM8K). null if not applicable.
#   split:                    Split name; "test" by default.
#   verifier:                 Key in src/verification/interface.py
#                             registry. Must match exactly.
#   prompt_field:             Field name with the question / prompt.
#   ground_truth_field:       Field name with the answer / test code.
#   entry_point_field:        Optional. For code-execution datasets
#                             (HumanEval) — field with the function
#                             name to call from the check program.
#   templates:
#     chat:
#       system:               System prompt for instruct/SFT/DPO/RLVR
#                             models. Encodes the answer-format hint
#                             (#### for GSM8K, \boxed{} for MATH).
#       user_template:        Python format string with prompt-field
#                             interpolation.
#     few_shot:
#       examples_path:        Path (relative to repo root) to a
#                             few-shot examples file. NOTE: these
#                             files do not yet exist; they will be
#                             added when H2 (which requires few-shot
#                             prompting on the base model) lands.
#       user_template:        Format string for the final question.
#   prompt_template_version:  String. Bumped when any template above
#                             changes. Must match the value passed to
#                             CacheKey.prompt_template_version so the
#                             cache invalidates correctly.
#   test_size:                Approximate test-split size. Used for
#                             compute-budget estimation; not enforced.

gsm8k:
  hf_id: "openai/gsm8k"
  hf_config: "main"
  split: "test"
  verifier: "gsm8k"
  prompt_field: "question"
  ground_truth_field: "answer"
  test_size: 1319
  templates:
    chat:
      system: "Solve the following math problem step by step. After your reasoning, write the final numeric answer on its own line in the format: #### <answer>"
      user_template: "{question}"
    few_shot:
      examples_path: "configs/few_shot/gsm8k_8shot.txt"  # TODO: create when H2 lands
      user_template: "Question: {question}\nAnswer:"
  prompt_template_version: "v1"

math:
  # NOTE on scope: EleutherAI/hendrycks_math is split into 7 sub-config
  # categories (algebra, counting_and_probability, geometry,
  # intermediate_algebra, number_theory, prealgebra, precalculus). The
  # full 5000-problem MATH test set is the union across categories.
  # We standardise on `algebra` for H1/H2/H4 — 1187 test problems is
  # ample for prompt-bootstrap CIs and avoids needing a multi-config
  # loader. Document this restriction in the paper. Switching to a
  # different category later requires bumping prompt_template_version
  # so old caches do not silently match.
  hf_id: "EleutherAI/hendrycks_math"
  hf_config: "algebra"
  split: "test"
  verifier: "math"
  prompt_field: "problem"
  ground_truth_field: "solution"
  test_size: 1187
  templates:
    chat:
      system: "Solve the following math problem. Show your reasoning, then put your final answer in \\boxed{}."
      user_template: "{problem}"
    few_shot:
      examples_path: "configs/few_shot/math_4shot.txt"  # TODO: create when H2 lands
      user_template: "Problem: {problem}\nSolution:"
  prompt_template_version: "v1"

matharena:
  # Deployment-experiment math dataset (Beurer-Kellner et al., ETH 2025).
  # Competition-math problems from contests held in 2025 — definitively
  # post-cutoff for the models we evaluate (Tulu-3-8B, Qwen2.5-7B,
  # Llama-3.1-8B all train on data through late 2023 / mid 2024). Two
  # subsets (AIME 2025 + BRUMO 2025) combined for 60 problems. Both have
  # the same schema: integer or short symbolic answer per problem,
  # verifiable via math-verify.
  #
  # `subsets` here lists full HF dataset paths (each is its own dataset
  # entry on the Hub; MathArena is an organisation, not a multi-config
  # dataset). The loader treats each subset as a standalone dataset
  # name and concatenates the resulting splits.
  hf_id: null
  subsets:
    - "MathArena/aime_2025"
    - "MathArena/brumo_2025"
  prompts_per_subset: 30
  split: "train"
  verifier: "matharena"
  prompt_field: "problem"
  ground_truth_field: "answer"
  test_size: 60
  templates:
    chat:
      system: "Solve the following competition math problem. Show your reasoning step-by-step, then put your final answer inside \\boxed{}."
      user_template: "{problem}"
  prompt_template_version: "v1"

livecodebench:
  # Deployment-experiment code dataset (Jain et al., LiveCodeBench 2024).
  # Competitive-programming problems from AtCoder and LeetCode with
  # time-stamped release dates. We filter to contest_date >= 2024-01-01
  # to retain only post-cutoff problems for the models we evaluate
  # (Llama-3.1-8B is clearly unseen; Tulu-3-8B and Qwen2.5-7B are
  # borderline depending on training cutoff). Yields 75 problems with a
  # mix of stdin and functional test formats.
  hf_id: "livecodebench/code_generation"
  hf_config: null
  split: "test"
  min_contest_date: "2024-01-01"
  verifier: "livecodebench"
  prompt_field: "question_content"
  ground_truth_field: "test_cases_json"     # synthesised at load time; see run_h1.py
  test_size: 75
  templates:
    chat:
      system: "Write a complete Python solution to the following problem. Return ONLY the code — no explanation, no markdown fences. Use stdin/stdout for input/output if the problem describes them; otherwise complete the starter code as specified."
      user_template: "{question_content}"
  prompt_template_version: "v1"

ultrafeedback:
  # Preference-experiment dataset. The H4-Zephyr-style binarized fork of
  # UltraFeedback: each row has (prompt, chosen, rejected) where `chosen`
  # is the GPT-4-judged better response. We use `chosen` as the
  # human-preferred reference y^+_i; samples drawn from a candidate model
  # are then compared to this reference via an LLM judge (see
  # src/verification/self_judge.py).
  #
  # Verifier `self_judge`: triggers the preference-mode code path in
  # run_h{1,2}.py — the judge is the model itself (H1) or a fixed
  # Tulu-3-RLVR judge (H2). Each (prompt, sample) pair is scored by L=5
  # i.i.d. judge calls with random A/B position; majority over the L
  # votes assigns ternary o in {0, 0.5, 1}.
  hf_id: "HuggingFaceH4/ultrafeedback_binarized"
  hf_config: null
  split: "test_prefs"
  verifier: "self_judge"
  prompt_field: "prompt"
  ground_truth_field: "chosen"      # the GPT-4-judged better response
  test_size: 1000
  templates:
    chat:
      system: ""                     # let each generator/judge use its own default
      user_template: "{prompt}"
  prompt_template_version: "v1"

bbh:
  # H4 non-math diversity axis. BIG-Bench Hard (Suzgun et al. 2022): a
  # suite of hard tasks spanning many *reasoning types* (logical deduction,
  # temporal/causal reasoning, fallacy detection, spatial tracking, ...),
  # not just arithmetic. This is what lets H4's length sweep speak to
  # reasoning length in general, rather than math-answer length specifically.
  #
  # `lukaemon/bbh` is a multi-config dataset: one config per task, each row
  # {input, target}, split "test" (250 examples/task). We list 24 of the 27
  # tasks as `subsets` (loaded as configs of the same hf_id, then
  # concatenated). Excluded: word_sorting + dyck_languages (free-form token
  # *sequences* — no short canonical answer, so budget forcing can't make
  # them cleanly verifiable) and multistep_arithmetic_two (math, already
  # covered by gsm8k/math). The retained tasks all have a short answer in
  # one of three shapes the bbh verifier dispatches on: a parenthesised
  # choice letter "(A)".."(R)", a boolean/token (True/False, Yes/No,
  # valid/invalid), or a bare integer (object_counting).
  #
  # 24 tasks x prompts_per_subset=20 = 480 prompts. Run H4 with
  # --num-prompts 480 to keep every task represented (the loader
  # concatenates in `subsets` order, so a smaller slice would drop whole
  # tasks from the tail).
  hf_id: "lukaemon/bbh"
  subsets:
    - "boolean_expressions"
    - "causal_judgement"
    - "date_understanding"
    - "disambiguation_qa"
    - "formal_fallacies"
    - "geometric_shapes"
    - "hyperbaton"
    - "logical_deduction_three_objects"
    - "logical_deduction_five_objects"
    - "logical_deduction_seven_objects"
    - "movie_recommendation"
    - "navigate"
    - "object_counting"
    - "penguins_in_a_table"
    - "reasoning_about_colored_objects"
    - "ruin_names"
    - "salient_translation_error_detection"
    - "snarks"
    - "sports_understanding"
    - "temporal_sequences"
    - "tracking_shuffled_objects_three_objects"
    - "tracking_shuffled_objects_five_objects"
    - "tracking_shuffled_objects_seven_objects"
    - "web_of_lies"
  prompts_per_subset: 20
  split: "test"
  verifier: "bbh"
  prompt_field: "input"
  ground_truth_field: "target"
  test_size: 480
  templates:
    chat:
      system: "Reason step by step about the following problem. Then state your final answer. For multiple-choice questions answer with the option letter in parentheses, e.g. (A). For yes/no, true/false, or valid/invalid questions answer with exactly that word. For counting questions answer with the number."
      user_template: "{input}"
  prompt_template_version: "v1"

humaneval:
  hf_id: "openai/openai_humaneval"
  hf_config: null
  split: "test"
  verifier: "humaneval"
  prompt_field: "prompt"
  ground_truth_field: "test"
  entry_point_field: "entry_point"
  test_size: 164
  templates:
    chat:
      system: "Complete the following Python function. Return ONLY the function definition (signature + body); do not include explanation or examples."
      user_template: "{prompt}"
    few_shot:
      examples_path: "configs/few_shot/humaneval_3shot.txt"  # TODO: create when H2 lands
      user_template: "{prompt}"
  prompt_template_version: "v1"

alpaca_eval:
  # 2nd preference dataset (paired with ultrafeedback). AlpacaEval's 805
  # single-turn instructions, each with a text-davinci-003 reference output
  # used as the human-preferred reference y^+. Same self_judge ternary
  # comparison as ultrafeedback. Loaded via hf_data_file (the dataset's
  # loading script is unsupported by the current datasets lib).
  hf_id: "tatsu-lab/alpaca_eval"
  hf_data_file: "alpaca_eval.json"
  split: "train"                     # load_dataset("json", ...) yields a 'train' split
  verifier: "self_judge"
  prompt_field: "instruction"
  ground_truth_field: "output"       # text-davinci-003 reference response
  test_size: 300
  templates:
    chat:
      system: ""
      user_template: "{instruction}"
  prompt_template_version: "v1"
